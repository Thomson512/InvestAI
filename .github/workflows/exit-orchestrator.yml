name: exit-orchestrator

on:
  # Nativní schedule vypnutý — stejný důvod jako buyer. Spouští pg_cron + dispatch-loop.
  workflow_dispatch:

concurrency:
  group: exit-orchestrator
  cancel-in-progress: false

permissions:
  contents: write

env:
  T212_ENVIRONMENT: demo
  ENABLE_LIVE_EXECUTION: "false"

jobs:
  exit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install "pandas-market-calendars>=4.0" tzdata

      - name: NYSE session gate
        id: gate
        run: python scripts/session_gate.py --mode buyer

      - name: Load evidence book
        run: |
          set -euo pipefail
          mkdir -p data
          git fetch origin runtime/evidence:refs/remotes/origin/runtime/evidence || true
          if git cat-file -e origin/runtime/evidence:evidence/exit/book.json 2>/dev/null; then
            git show origin/runtime/evidence:evidence/exit/book.json > data/expected_positions.json
          fi
          if git cat-file -e origin/runtime/evidence:evidence/buyer/latest.json 2>/dev/null; then
            git show origin/runtime/evidence:evidence/buyer/latest.json > data/buyer_evidence.json
          fi

      - name: No-op (NYSE closed)
        if: steps.gate.outputs.open != 'true'
        run: python scripts/exit_orchestrator.py --session "${{ steps.gate.outputs.session }}" --noop --reason "${{ steps.gate.outputs.reason }}"

      - name: Wait for buyer T212 snapshot
        if: steps.gate.outputs.open == 'true'
        run: sleep 50

      - name: Broker snapshot
        if: steps.gate.outputs.open == 'true'
        env:
          T212_API_KEY: ${{ secrets.T212_API_KEY }}
          T212_API_SECRET: ${{ secrets.T212_API_SECRET }}
        run: python scripts/broker_snapshot.py --output data/snapshot.json

      - name: Stops, reconcile, daily_pnl, heartbeat
        if: steps.gate.outputs.open == 'true'
        env:
          T212_API_KEY: ${{ secrets.T212_API_KEY }}
          T212_API_SECRET: ${{ secrets.T212_API_SECRET }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          python scripts/exit_orchestrator.py \
            --session "${{ steps.gate.outputs.session }}" \
            --snapshot data/snapshot.json \
            --book data/expected_positions.json \
            --buyer-evidence data/buyer_evidence.json

      - name: Publish evidence to runtime/evidence
        if: always() && hashFiles('data/exit_evidence.json') != ''
        run: |
          set -euo pipefail
          SESSION="${{ steps.gate.outputs.session }}"
          STAMP=$(python -c "import json; print(json.load(open('data/exit_evidence.json'))['generated_at'].replace(':',''))")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin runtime/evidence:refs/remotes/origin/runtime/evidence || true
          WORK="${RUNNER_TEMP}/investai-evidence"
          rm -rf "$WORK"
          if git rev-parse --verify origin/runtime/evidence >/dev/null 2>&1; then
            git worktree add "$WORK" origin/runtime/evidence
          else
            git worktree add --detach "$WORK"
            git -C "$WORK" checkout --orphan runtime/evidence
            git -C "$WORK" rm -rf . >/dev/null 2>&1 || true
          fi
          mkdir -p "$WORK/evidence/exit" "$WORK/evidence/exit/sessions/${SESSION}"
          cp data/exit_evidence.json "$WORK/evidence/exit/latest.json"
          cp data/exit_evidence.json "$WORK/evidence/exit/sessions/${SESSION}/${STAMP}.json"
          git -C "$WORK" add evidence/exit
          if git -C "$WORK" diff --cached --quiet; then
            echo "No exit evidence changes"
          else
            git -C "$WORK" commit -m "exit ${SESSION}"
            bash scripts/push_runtime_evidence.sh "$WORK"
          fi
